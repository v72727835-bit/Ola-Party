name: Android APK

# Builds the Party App Android APK on every push to main that touches the
# mobile app, and publishes it to a fixed release so this link never changes:
# https://github.com/v72727835-bit/Ola-Party/releases/download/latest-apk/party-app.apk
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  RELEASE_TAG: latest-apk
  APK_NAME: party-app.apk
  EXPO_PUBLIC_API_URL: https://ola-party.onrender.com/api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set versionCode from run number
        # Each build gets a higher versionCode so Android installs it over the old one.
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.android.versionCode = 100 + Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
            console.log('versionCode', cfg.expo.android.versionCode);
          "

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Build release APK
        working-directory: apps/mobile/android
        # Release builds are signed with the template's fixed debug keystore,
        # so every new APK installs as an update over the previous one.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: party-app-apk
          path: ${{ env.APK_NAME }}
          retention-days: 14

      - name: Publish to fixed release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest Party App build from ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER}). Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          # Move the tag to this commit, then replace the APK in place.
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
            gh release edit "$RELEASE_TAG" --title "Party App (latest APK)" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --title "Party App (latest APK)" --notes "$notes" --latest
          fi
